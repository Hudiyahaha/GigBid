[project]
name = "gigbid"
version = "0.2.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016 R&D assignment)"
requires-python = ">=3.11,<3.13"
dependencies = [
  # web / api
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  # agents
  "langgraph>=0.6",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-checkpoint-postgres>=2.0",
  "langgraph-supervisor>=0.0.27",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langchain-mcp-adapters>=0.1",
  "mcp>=1.12",
  # storage / queue
  "sqlalchemy>=2.0",
  "psycopg[binary,pool]>=3.2",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "arq>=0.26",
  # rag
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "sentence-transformers>=3.0",
  "rank-bm25>=0.2.2",
  "qdrant-client>=1.10",
  "networkx>=3.3",
  "pypdf>=4.3",
  "fpdf2>=2.7",
  # security
  "cryptography>=43",
  "bcrypt>=4.1",
  "pyjwt>=2.9",
  # observability
  "arize-phoenix-otel>=0.6",
  "openinference-instrumentation-langchain>=0.1.29",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-exporter-otlp>=1.26",
  "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "fakeredis>=2.24",
    "mypy>=1.11",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "apps", "rag", "mcp_servers", "worker", "evals", "gigsim"]

[tool.ruff]
line-length = 110
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
testpaths = ["tests", "mcp_servers"]
